<!doctype html>
<!--
  Source of rich-menu.png. The grid matches menu.ts: one 2500x843 button on top, four 625x843 buttons below.
  Render from apps/liff:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=2500,1686 --virtual-time-budget=5000 \
    --screenshot=scripts/rich-menu/rich-menu.png scripts/rich-menu/rich-menu.html
  Never use green or yellow here: the app uses them for parking status.
-->
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;700&display=block" />
    <style>
      :root {
        --primary: oklch(0.59 0.238 1.4);
        --primary-soft: oklch(0.95 0.03 1.4);
        --foreground: oklch(0.145 0 0);
        --muted: oklch(0.45 0 0);
        --border: oklch(0.9 0 0);
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 2500px; height: 1686px; overflow: hidden; }
      body {
        display: grid;
        grid-template-rows: 843px 843px;
        grid-template-columns: repeat(4, 625px);
        background: white;
        color: var(--foreground);
        font-family: "Noto Sans Thai", sans-serif;
      }
      svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .main {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 110px;
        padding: 0 190px;
        background: var(--primary);
        color: white;
      }
      .main .badge {
        display: grid;
        place-items: center;
        width: 420px;
        height: 420px;
        border-radius: 96px;
        background: white;
        color: var(--primary);
        flex: none;
      }
      .main .badge svg { width: 300px; height: 300px; }
      .main .text { flex: 1; display: grid; gap: 28px; }
      .main .brand { font-size: 72px; font-weight: 500; opacity: 0.85; }
      .main h1 { font-size: 168px; font-weight: 700; line-height: 1.15; }
      .main p { font-size: 72px; font-weight: 500; opacity: 0.9; }
      .main .go { width: 170px; height: 170px; flex: none; stroke-width: 2.5; }
      .button {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 64px;
        border-right: 6px solid var(--border);
      }
      .button:last-child { border-right: 0; }
      .button .icon {
        display: grid;
        place-items: center;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary);
      }
      .button .icon svg { width: 170px; height: 170px; }
      .button span { font-size: 80px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="badge">
        <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 17V7h4a3 3 0 0 1 0 6H9" /></svg>
      </div>
      <div class="text">
        <div class="brand">ParkMap</div>
        <h1>พื้นที่ว่างตอนนี้</h1>
        <p>เลือกลานจอดรถเพื่อดูพื้นที่ว่าง</p>
      </div>
      <svg class="go" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
    </div>
    <div class="button">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M19.43 12.935c.357-.967.57-1.955.57-2.935a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32.197 32.197 0 0 0 .813-.728" />
          <circle cx="12" cy="10" r="3" />
          <path d="m16 18 2 2 4-4" />
        </svg>
      </div>
      <span>จุดที่จอดรถไว้</span>
    </div>
    <div class="button">
      <div class="icon">
        <svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11" /></svg>
      </div>
      <span>ลานจอดใกล้ฉัน</span>
    </div>
    <div class="button">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <path d="M12 17h.01" />
        </svg>
      </div>
      <span>วิธีใช้งาน</span>
    </div>
    <div class="button">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </div>
      <span>ตั้งค่า</span>
    </div>
  </body>
</html>
