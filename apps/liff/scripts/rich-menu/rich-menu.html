<!doctype html>
<!--
  Source of rich-menu.jpg. The tiles sit on the tap areas in menu.ts: one 1150x1586 tile on the
  left and four 575x768 tiles on the right, with 50px margins and gutters. The main tile carries
  the logo, so the mascot appears once; the other tiles use Lucide icons. Pink marks only the icons
  and the call to action, so the main button stays the focus.
  logo.webp is tools/calibration-ui/public/branding/parkmap-logo.png cropped to its content:
  cwebp -q 90 -alpha_q 100 -crop 21 9 916 685 <logo png> -o scripts/rich-menu/logo.webp
  Render from apps/liff, then save as JPEG so it stays under LINE's 1 MB limit:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=2500,1686 --virtual-time-budget=5000 \
    --screenshot=/tmp/rich-menu.png scripts/rich-menu/rich-menu.html
  sips -s format jpeg -s formatOptions 88 /tmp/rich-menu.png --out scripts/rich-menu/rich-menu.jpg
  Apart from the logo itself, never add green or yellow here: the app uses them for parking status.
-->
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=block" />
    <style>
      :root {
        --pink: oklch(0.59 0.238 1.4);
        --pink-soft: oklch(0.955 0.03 1.4);
        --ground: oklch(0.93 0.008 350);
        --card: oklch(1 0 0);
        --night: oklch(0.2 0.02 350);
        --ink: oklch(0.25 0.025 350);
        --muted: oklch(0.8 0.015 350);
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 2500px; height: 1686px; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 1150px 575px 575px;
        grid-template-rows: 768px 768px;
        gap: 50px;
        padding: 50px;
        background: var(--ground);
        color: var(--ink);
        font-family: "Mitr", sans-serif;
      }
      svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      .tile { border-radius: 100px; background: var(--card); }

      .main {
        grid-row: 1 / -1;
        display: flex; flex-direction: column; align-items: center;
        padding: 70px 100px 110px;
        background: var(--night); color: white; text-align: center;
      }
      .main img { width: 900px; height: auto; }
      .main h1 { margin-top: 40px; font-size: 156px; font-weight: 600; line-height: 1.2; }
      .main p { margin-top: 20px; font-size: 64px; font-weight: 400; color: var(--muted); }
      .go {
        margin-top: auto;
        display: flex; align-items: center; gap: 20px;
        padding: 30px 72px 34px 84px; border-radius: 999px;
        background: var(--pink); font-size: 76px; font-weight: 500;
      }
      .go svg { width: 76px; height: 76px; stroke-width: 2.5; }

      .button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; }
      .icon { display: grid; place-items: center; width: 280px; height: 280px; border-radius: 50%; background: var(--pink-soft); color: var(--pink); }
      .icon svg { width: 150px; height: 150px; stroke-width: 1.75; }
      /* Two label lines tall even for one-line labels, so icons and labels line up across tiles. */
      .button span { display: grid; align-content: center; min-height: 2.3em; font-size: 88px; font-weight: 500; line-height: 1.15; text-align: center; }
    </style>
  </head>
  <body>
    <div class="tile main">
      <img src="logo.webp" alt="" />
      <h1>พื้นที่ว่างตอนนี้</h1>
      <p>เลือกลานจอด ดูที่ว่าง</p>
      <div class="go">
        ดูเลย
        <svg viewBox="0 0 24 24"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>
      </div>
    </div>

    <div class="tile button">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M19.43 12.935c.357-.967.57-1.955.57-2.935a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32.197 32.197 0 0 0 .813-.728" /><circle cx="12" cy="10" r="3" /><path d="m16 18 2 2 4-4" /></svg>
      </div>
      <span>จุดที่จอด<br />รถไว้</span>
    </div>
    <div class="tile button">
      <div class="icon">
        <svg viewBox="0 0 24 24"><polygon points="3 11 22 2 13 21 11 13 3 11" /></svg>
      </div>
      <span>ลานจอด<br />ใกล้ฉัน</span>
    </div>
    <div class="tile button">
      <div class="icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><path d="M12 17h.01" /></svg>
      </div>
      <span>วิธีใช้งาน</span>
    </div>
    <div class="tile button">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg>
      </div>
      <span>ตั้งค่า</span>
    </div>
  </body>
</html>
