[project]
name = "parkmap-classifier-curation"
version = "0.1.0"
description = "Dataset EDA, audit and review tooling for the motorcycle model-family classifier; no classifier training"
requires-python = ">=3.12,<3.13"
# Separate from apps/vision-api: FiftyOne needs Pillow>=12.2, the API pins Pillow<12.
dependencies = [
  "cleanlab==2.9.0",
  "cleanvision==0.3.7",
  "fiftyone==1.22.1",
  "fiftyone-mcp-server==0.1.16",
  "numpy>=2.0,<3.0",
  "pyyaml>=6.0,<7.0",
  "scikit-learn==1.9.1",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==5.22.1",
  "umap-learn==0.5.12",
]

[dependency-groups]
dev = [
  "ruff==0.16.9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
