# =====================================================================================
# ไฟล์ตั้งค่าเดียวของงาน Detection (หาตำแหน่งรถมอเตอร์ไซค์ในภาพ)
# ปรับค่าที่นี่ที่เดียว train.py ไม่มีค่าใด hard-code ไว้
# path ทุกตัวนับจากโฟลเดอร์ของไฟล์นี้ (tools/yolo-training/detection/)
# =====================================================================================

# ---------- ข้อมูลและที่เก็บผลลัพธ์ ----------
dataset: ../datasets/spu-park-split-real   # หรือ ../datasets/spu-park-split-roi (ระบายนอก ROI เป็นสีเทา สร้างด้วย make_split.py --roi roi.json)
                                      # โฟลเดอร์ dataset ที่มี train/ val/ test/ (images + labels) และ sessions.json
segment_dataset: ../datasets/spu-park-split-seg   # dataset ของโมเดล task: segment (label เป็น polygon ไม่ใช่กล่อง)
                                      # แบ่ง train/val/test เหมือน dataset ด้านบนทุกภาพ สร้างด้วย make_split.py --seg
output: runs                          # ผลการเทรนทุกรอบ: runs/<model>/round-NN_<วันที่>_<เวลา>/
weights_dir: weights                  # ที่เก็บ pretrained weights ที่โหลดอัตโนมัติครั้งแรก

classes:                              # class id -> ชื่อ; label ที่มี id อื่นจะถูกปฏิเสธตอนตรวจ dataset
  0: motorcycle

# ---------- ค่าการเทรนที่ใช้ร่วมกันทุกโมเดล ----------
# ทุก key ในบล็อกนี้ส่งตรงให้ Ultralytics model.train(); พิมพ์ชื่อผิด Ultralytics จะแจ้ง error
# โมเดลใดต้องการค่าต่างไป ให้ใส่ใน "train:" ของโมเดลนั้นด้านล่าง (จะทับค่าที่นี่)
train:
  # --- รอบการเทรน ---
  epochs: 300           # จำนวนรอบสูงสุดที่เทรนผ่านข้อมูล train ทั้งชุด
  patience: 0          # หยุดก่อนถ้า val mAP ไม่ดีขึ้นติดต่อกันกี่ epoch (0 = ไม่หยุดก่อน)

  # --- ขนาดภาพ / หน่วยความจำ ---
  imgsz: 1600          # ขนาดด้านยาวของภาพตอนเทรน (px) ภาพ SPU กว้าง 3400; ค่าน้อยรถจะเล็กจนหาไม่เจอ
                         #   API ต้องใช้ค่าเดียวกันตอนใช้งาน (PARKMAP_MODEL_IMGSZ)
  batch: 2              # จำนวนภาพต่อ step; out of memory ให้ลดเป็น 2 หรือ 1
  device: auto           # auto = ใช้ GPU ถ้ามี ไม่งั้น CPU; หรือระบุ cpu / 0 (GPU ตัวแรก)
  workers: 2             # จำนวน process โหลดภาพคู่ขนาน (Windows แนะนำ 0-2)
  cache: false           # true = เก็บภาพไว้ใน RAM ให้เร็วขึ้น แต่ใช้ RAM มาก

  # --- ทำซ้ำได้ (reproducibility) ---
  seed: 42               # เลขสุ่มตั้งต้น ให้ผลเทรนซ้ำได้ใกล้เคียงเดิม
  deterministic: true    # บังคับให้คำนวณแบบให้ผลเดิมทุกครั้ง (ช้าลงเล็กน้อย)

  # --- Optimizer / learning rate ---
  optimizer: AdamW       # SGD, Adam, AdamW, auto (auto จะเลือกเองและไม่สนค่า lr0/momentum ด้านล่าง)
  lr0: 0.002             # learning rate เริ่มต้น
  lrf: 0.01              # learning rate สุดท้าย = lr0 x lrf (ลดลงเรื่อยๆ ระหว่างเทรน)
  momentum: 0.9          # momentum (SGD) / beta1 (Adam, AdamW)
  weight_decay: 0.0005   # ลงโทษน้ำหนักที่ใหญ่เกินไป ช่วยลด overfitting
  warmup_epochs: 3.0     # จำนวน epoch แรกที่ค่อยๆ เพิ่ม learning rate จาก 0 ขึ้นไปถึง lr0
  cos_lr: false          # true = ลด learning rate แบบโค้ง cosine แทนเส้นตรง
  nbs: 4                 # nominal batch size: Ultralytics รวม gradient จนครบ nbs ภาพก่อนอัปเดตน้ำหนัก 1 ครั้ง
                         #   ค่าเริ่มต้นของ Ultralytics คือ 64 แต่ train มีภาพจริงแค่ 18 ภาพ (+ synthetic 26) จะอัปเดตน้อยเกินไป
                         #   (ค่า val ใน results.csv จึงซ้ำกันหลาย epoch) ตั้งให้เท่ากับ batch = อัปเดตทุก step
  warmup_bias_lr: 0.002  # learning rate เริ่มต้นของ bias ช่วง warmup (ค่าเริ่มต้น Ultralytics 0.1 ออกแบบมาสำหรับ SGD
                         #   ใช้กับ AdamW แรงเกินจน mAP ตกเกือบ 0 ช่วงต้น) ตั้งเท่ากับ lr0

  # --- การตรวจจับ ---
  max_det: 300           # จำนวนกล่องสูงสุดต่อภาพ (ลาน SPU มีได้ราว 150 คัน)

  # --- Data augmentation (สุ่มดัดแปลงภาพ train เท่านั้น ไม่แตะ val/test) ---
  hsv_h: 0.015           # สุ่มเปลี่ยนสี (hue) สัดส่วน 0-1
  hsv_s: 0.7             # สุ่มความอิ่มสี (saturation)
  hsv_v: 0.4             # สุ่มความสว่าง (value) ช่วยเรื่องแดด/เมฆ/พื้นเปียก
  degrees: 3.0           # สุ่มหมุนภาพ ±องศา (กล้องติดตั้งตายตัว จึงใช้ค่าน้อย)
  translate: 0.08        # สุ่มเลื่อนภาพ ±สัดส่วนของความกว้าง/สูง
  scale: 0.25            # สุ่มย่อ/ขยายภาพ ±สัดส่วน
  fliplr: 0.5            # โอกาสกลับภาพซ้าย-ขวา (0-1)
  flipud: 0.0            # โอกาสกลับภาพบน-ล่าง (0 = ปิด เพราะกล้องไม่เคยกลับหัว)
  mosaic: 0.5            # โอกาสต่อ 4 ภาพเป็นภาพเดียว ช่วยเห็นรถหลายขนาด
  mixup: 0.0             # โอกาสซ้อนสองภาพเข้าด้วยกัน (0 = ปิด)
  close_mosaic: 10       # ปิด mosaic ใน N epoch สุดท้าย ให้โมเดลเห็นภาพจริงก่อนจบ

  # --- ผลลัพธ์ ---
  plots: true            # บันทึกกราฟและภาพตัวอย่างลงโฟลเดอร์ run
  verbose: true          # แสดงรายละเอียดระหว่างเทรน (เก็บลง train.log ด้วย)

# ---------- ค่าตอนวัดผลชุด test (.\train-detector test) ----------
# imgsz และ device ใช้ค่าเดียวกับรอบที่ถูกทดสอบโดยอัตโนมัติ
test:
  split: test            # ใช้ชุด test (held-out) ทดสอบได้ครั้งเดียวต่อรอบ
  conf: 0.25             # ความมั่นใจขั้นต่ำของกล่องที่นับ (ควรเท่ากับ PARKMAP_MODEL_CONF ของ API)
  iou: 0.5               # IoU ของ NMS สำหรับรวมกล่องซ้อน (ควรเท่ากับ PARKMAP_MODEL_NMS_IOU)
  batch: 1               # จำนวนภาพต่อ step ตอนทดสอบ
  max_det: 300           # จำนวนกล่องสูงสุดต่อภาพ

# ---------- รายการโมเดลในเมนู ----------
# weights:     ไฟล์ .pt = เริ่มจาก pretrained weights (โหลดอัตโนมัติ)
#              ไฟล์ .yaml = สร้างโครงโมเดลเปล่า (ไม่ pretrain) เริ่มจากค่าสุ่ม
# family:      yolo (ค่าเริ่มต้น) หรือ rtdetr
# task:        detect (ค่าเริ่มต้น: หากล่อง ใช้ dataset) หรือ segment (หากล่อง + ขอบรถเป็น mask ใช้ segment_dataset)
#              โมเดล segment ต้องใช้ weights ที่ลงท้าย -seg และเลือก best.pt จาก mAP ของกล่องเหมือนโมเดล detect จึงเทียบกันได้
# description: ข้อความที่แสดงในเมนู
# train:       (ไม่บังคับ) ค่าที่ต่างจากบล็อก train ด้านบนสำหรับโมเดลนี้
# COCO = ชุดภาพ 118k ภาพ 80 คลาส (มีคลาส motorcycle) โมเดล pretrain จึงรู้จักรถอยู่แล้ว
models:
  yolo26s:
    weights: yolo26s.pt
    description: "[Pretrained COCO] YOLO26 Small 9.5M params. รุ่นใหม่สุด ไม่ต้องใช้ NMS เก่งวัตถุเล็ก แนะนำให้ลองก่อน"
  yolo11s:
    weights: yolo11s.pt
    description: "[Pretrained COCO] YOLO11 Small 9.4M params. Baseline ที่พิสูจน์แล้ว ค่าเริ่มต้นเดิมของ ParkMap"
  yolo26n:
    weights: yolo26n.pt
    description: "[Pretrained COCO] YOLO26 Nano 2.4M params. เร็วสุดบน CPU เหมาะถ้า API ไม่มี GPU แม่นน้อยกว่าในแถวรถแน่น"
  yolo11n:
    weights: yolo11n.pt
    description: "[Pretrained COCO] YOLO11 Nano 2.6M params. เล็กสุด ตระกูลเดียวกับ baseline-yolo11n.pt ที่ API ใช้อยู่"
  yolo26m:
    weights: yolo26m.pt
    description: "[Pretrained COCO] YOLO26 Medium 20.4M params. แม่นขึ้นกับรถที่ถูกบัง ต้องใช้ GPU ช้ากว่า Small ราว 2 เท่า"
    train: {batch: 2}
  yolo11m:
    weights: yolo11m.pt
    description: "[Pretrained COCO] YOLO11 Medium 20.1M params. ตัวอ้างอิงความแม่นของ YOLO11 ต้องใช้ GPU"
    train: {batch: 2}
  yolo12s:
    weights: yolo12s.pt
    description: "[Pretrained COCO] YOLO12 Small 9.3M params. ใช้ attention อาจช่วยรถบังกันหนาแน่น แต่เทรนช้าและผันผวนกว่า"
  rtdetr-l:
    weights: rtdetr-l.pt
    family: rtdetr
    description: "[Pretrained COCO] RT-DETR Large 32M params (ไม่ใช่ YOLO: Transformer จาก Baidu). ไม่ต้องใช้ NMS ดีกับฉากแน่น ต้องใช้ GPU และ RAM มาก"
    train: {batch: 2}
  rtdetr-x:
    weights: rtdetr-x.pt
    family: rtdetr
    description: "[Pretrained COCO] RT-DETR X-Large 67M params (ไม่ใช่ YOLO). แม่นสุดในรายการ แต่ช้าสุดและใช้ GPU memory มาก"
    train: {batch: 1}
  yolo26s-scratch:
    weights: yolo26s.yaml
    description: "[ไม่ Pretrain] YOLO26 Small เริ่มจากค่าสุ่ม ใช้เปรียบเทียบว่า pretrain ช่วยแค่ไหน คาดว่าแม่นต่ำมากกับข้อมูลภาพจริง 18 ภาพ"
    train: {pretrained: false, epochs: 300, patience: 60}

  # ----- Segmentation: ทายกล่อง + mask ขอบรถทีละคัน (เรียนจาก polygon ที่ติด label ไว้) -----
  # กล่องที่ได้ใช้นับรถได้เหมือนโมเดล detect; mask ช่วยแยกรถที่จอดชิดกัน แต่เทรนช้ากว่าและใช้ GPU memory มากกว่า
  yolo26s-seg:
    weights: yolo26s-seg.pt
    task: segment
    description: "[Pretrained COCO] YOLO26 Small Segmentation 11.5M params. คู่เทียบของ yolo26s ได้ mask รายคันเพิ่ม"
  yolo26n-seg:
    weights: yolo26n-seg.pt
    task: segment
    description: "[Pretrained COCO] YOLO26 Nano Segmentation 3.1M params. เล็กสุดของ YOLO26 seg เหมาะถ้า API รันบน CPU"
  yolo11s-seg:
    weights: yolo11s-seg.pt
    task: segment
    description: "[Pretrained COCO] YOLO11 Small Segmentation 10.1M params. Baseline segmentation ที่ใช้กันแพร่หลาย"
  yolo11n-seg:
    weights: yolo11n-seg.pt
    task: segment
    description: "[Pretrained COCO] YOLO11 Nano Segmentation 2.9M params. เล็กและเร็ว คู่เทียบของ yolo11n"
