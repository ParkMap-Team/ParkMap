name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm skills:check
      - run: pnpm skills:test
      - run: pnpm --filter @parkmap/calibration-ui lint
      - run: pnpm --filter @parkmap/calibration-ui typecheck
      - run: pnpm --filter @parkmap/calibration-ui test
      - run: pnpm --filter @parkmap/calibration-ui build

  liff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types match openapi.json
        run: |
          pnpm --filter @parkmap/liff api:generate
          git diff --exit-code -- apps/liff/src/lib/api/schema.gen.ts
      - run: pnpm --filter @parkmap/liff lint
      - run: pnpm --filter @parkmap/liff typecheck
      - run: pnpm --filter @parkmap/liff test
      - run: pnpm --filter @parkmap/liff build

  backend:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/vision-api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parkmap
          POSTGRES_PASSWORD: parkmap
          POSTGRES_DB: parkmap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkmap -d parkmap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PARKMAP_TEST_DATABASE_URL: postgresql://parkmap:parkmap@localhost:5432/parkmap_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/vision-api/requirements-dev.lock
      - run: python -m pip install uv==0.11.7
      - run: uv pip sync --system --torch-backend cpu requirements-dev.lock
      - run: ruff check --select F app tests migrations scripts/export_openapi.py
      - run: python scripts/export_openapi.py --check
      - run: python -m pytest -q tests
