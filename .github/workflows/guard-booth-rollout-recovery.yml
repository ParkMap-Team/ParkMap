name: Guard Booth rollout recovery
on:
  push:
    branches: [ops/guard-booth-rollout-recovery]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      API_UUID: ${{ vars.COOLIFY_APP_API }}
      LIFF_UUID: ${{ vars.COOLIFY_APP_LIFF }}
      WORKER_UUID: ${{ vars.COOLIFY_APP_WORKER }}
    steps:
      - name: Inspect Coolify release status
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl -fsS --max-time 20 -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" "$COOLIFY_URL/api/v1/$1"
          }
          for entry in "api:$API_UUID" "liff:$LIFF_UUID" "worker:$WORKER_UUID"; do
            name=${entry%%:*}
            uuid=${entry#*:}
            echo "Application: $name"
            api "applications/$uuid" | jq -c '{build_pack,git_branch,git_commit_sha,status}'
            api "deployments/applications/$uuid?take=3" | jq -c '.deployments[] | {deployment_uuid,commit,status,created_at,updated_at}'
          done
          for id in k4bb6cm5nsv7vshn82nxn0j2 gvfyqktjow1zhzicolbwzca2; do
            api "deployments/$id" | jq -c '{deployment_uuid,status,updated_at,stages:(
              (.logs // "[]") | if type == "string" then (try fromjson catch []) else . end
              | if type == "array" then [.[] | objects | .output // "" | strings
                | scan("exporting layers|unpacking|Rolling update started|Rolling update completed|New container started|Waiting for healthcheck|no space left on device|out of memory|Build failed|Permission denied|Connection timed out|context canceled|Building docker image started"; "i")][-8:] else [] end
            )}'
          done
