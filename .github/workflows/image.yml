name: Image

on:
  workflow_call:
    inputs:
      image:
        description: GHCR repository name under ghcr.io/parkmap-team
        required: true
        type: string
      context:
        description: Docker build context from the repository root
        required: true
        type: string
      dockerfile:
        description: Dockerfile path from the repository root
        required: true
        type: string
      push:
        description: Push the image; pull requests only check that it builds
        required: true
        type: boolean
      build_args:
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # A pushed image is deployed, so an empty build argument (an unset repository variable) fails here.
      - if: inputs.push && inputs.build_args != ''
        name: Build arguments are set
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
        shell: bash
        run: |
          while IFS= read -r arg; do
            [ -z "$arg" ] && continue
            if [ -z "${arg#*=}" ]; then
              echo "Build argument ${arg%%=*} is empty" >&2
              exit 1
            fi
          done <<< "$BUILD_ARGS"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          build-args: ${{ inputs.build_args }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/parkmap-team/${{ inputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
