name: Account parking release
on:
  push:
    branches: [ops/account-parking-release]
permissions:
  contents: read
  actions: read
concurrency:
  group: account-parking-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      API_UUID: ${{ vars.COOLIFY_APP_API }}
      WORKER_UUID: ${{ vars.COOLIFY_APP_WORKER }}
      LIFF_UUID: ${{ vars.COOLIFY_APP_LIFF }}
      BOT_UUID: svalht0ztkvtlwifegi9n9ly
      RELEASE: 59aa078bf60adcdbf5624c560c86fba1cf64c4ec
      CI_RUN: '44574247092'
    steps:
      - name: Wait for the existing main CI without queuing another image build
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5400))
          while (( SECONDS < deadline )); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN")
            test "$(jq -r '.head_sha' <<< "$run")" = "$RELEASE"
            if [ "$(jq -r '.status' <<< "$run")" = completed ]; then
              if [ "$(jq -r '.conclusion' <<< "$run")" = success ]; then
                echo "Existing main CI passed; reusing its published images."
                exit 0
              fi
              echo "Main CI failed; no release changes were made."
              exit 1
            fi
            sleep 60
          done
          echo "Main CI is still pending; no release changes were made."
          exit 1
      - name: Deploy the matching LIFF display
        shell: bash
        run: |
          set -euo pipefail
          api() {
            curl -fsS --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" "$@"
          }
          base="$COOLIFY_URL/api/v1"
          for spec in "parkmap-liff:$LIFF_UUID:parkmap-liff"; do
            IFS=: read -r name uuid package <<< "$spec"
            echo "Checking $name"
            test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$RELEASE"
            api "$base/deployments" | jq -e 'type == "array" and length == 0' >/dev/null
            app=$(api "$base/applications/$uuid")
            jq '{name,status,build_pack,git_branch,git_commit_sha,dockerfile_location}' <<< "$app"
            jq -e --arg name "$name" '.name == $name and .build_pack == "dockerfile" and .git_branch == "main" and .git_commit_sha == "HEAD" and (.status == "running:healthy" or ($name == "parkmap-worker" and .status == "running:unknown")) and (.dockerfile_location | endswith("Dockerfile.ghcr"))' <<< "$app" >/dev/null
            image="ghcr.io/parkmap-team/$package:sha-$RELEASE"
            envs=$(api "$base/applications/$uuid/envs")
            # Coolify can redact the value even when the variable metadata is readable.
            # Never treat a redacted value as proof that the target image is deployed.
            jq -e '[.[] | select(.key == "PARKMAP_IMAGE" and .is_preview != true)] | length == 1 and (.[0].is_buildtime == true)' <<< "$envs" >/dev/null
            current=$(jq -r '.[] | select(.key == "PARKMAP_IMAGE" and .is_preview != true) | .value // empty' <<< "$envs")
            latest=$(api "$base/deployments/applications/$uuid?take=1" | jq -c '.deployments[0] // {}')
            if [ "$current" = "$image" ] && jq -e --arg sha "$RELEASE" '.commit == $sha and .status == "finished"' <<< "$latest" >/dev/null; then
              echo "$name already has the requested image."
              continue
            fi
            # Only the image reference changes. Keep every credential, flag and other variable.
            update=$(jq -c --arg value "$image" '.[] | select(.key == "PARKMAP_IMAGE" and .is_preview != true) | {key,value:$value,is_preview:false,is_buildtime,is_runtime,is_literal,is_multiline} | with_entries(select(.value != null))' <<< "$envs")
            api -X PATCH "$base/applications/$uuid/envs" --data "$update" >/dev/null
            job=$(api -X POST "$base/deploy?uuid=$uuid&force=false" | jq -er '.deployments[0].deployment_uuid | select(type == "string" and test("^[a-z0-9]+$"))')
            echo "$name queued: $job"
            deadline=$((SECONDS + 2400))
            while (( SECONDS < deadline )); do
              result=$(api "$base/deployments/$job")
              state=$(jq -r '.status // empty' <<< "$result")
              case "$state" in
                finished)
                  jq -e --arg sha "$RELEASE" '.commit == $sha' <<< "$result" >/dev/null
                  api "$base/applications/$uuid" | jq -e --arg name "$name" '.status == "running:healthy" or ($name == "parkmap-worker" and .status == "running:unknown")' >/dev/null
                  echo "$name finished."
                  break ;;
                failed|cancel*) echo "$name ended: $state"; exit 1 ;;
              esac
              sleep 60
            done
            test "$state" = finished
          done
